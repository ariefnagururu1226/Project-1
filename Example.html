<DOCTYPE html>
<html>
<head>
</head>
<body>
<title>Event Listener Example</title>
<h2>Event Listener Demo</h2>
<button id="btn1">Click Me</button>
<button id="btn2">Change Color</button>
<p id="message">Watch this text change! hiiii</p>
<script>
// Event listener for button click
document.getElementById("btn1").addEventListener("click", function() {
alert("Button 1 was clicked!");
});
// Event listener to change text color
document.getElementById("btn2").addEventListener("click", function() {
document.getElementById("message").style.color = "red";
document.getElementById("message").textContent = "The text color is now red!";
});
</script>
</body>
</html>
